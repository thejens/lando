[package]
name = "lando-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Runs tailscale-core on a development machine as a real tailnet node."

[dependencies]
tailscale-core = { path = "../tailscale-core" }
rand_core = { workspace = true, features = ["getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.9"
rustls-pki-types = "1.15.1"
